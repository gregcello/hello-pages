<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hello, Pages</title>
  <style>
    :root { --bg: #f7f5f0; --fg: #1f2328; --muted: #5b6370; --accent: #2f6f4f; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15181c; --fg: #e8e6e1; --muted: #9aa3ad; --accent: #7fc8a0; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font: 18px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      padding: 16px;
    }
    main { max-width: 34rem; }
    h1 { font-size: 2.2rem; line-height: 1.2; margin: 0 0 .5rem; }
    p { margin: .5rem 0; color: var(--muted); }
    .dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%;
           background: var(--accent); margin-right: .4em; vertical-align: .1em; }
  </style>
</head>
<body>
  <main>
    <h1>Hello from Cloudflare</h1>
    <p><span class="dot"></span>If you can read this, publishing works.</p>
    <p>This is a test site for gregcello, built and published automatically by Cloudflare on every push to GitHub.</p>
  </main>
</body>
</html>
